<svg viewBox="0 0 500 160" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="c1Moon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFA53B" />
      <stop offset="60%" stopColor="#FF7417" />
      <stop offset="100%" stopColor="#D94E00" />
    </linearGradient>
    <linearGradient id="c1Purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#C4B5FD" />
      <stop offset="100%" stopColor="#8B5CF6" />
    </linearGradient>
    <radialGradient id="c1Aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#FF7417" stopOpacity="0.4" />
      <stop offset="100%" stopColor="#FF7417" stopOpacity="0" />
    </radialGradient>
    <filter id="c1Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Aura Glow behind symbol -->
  <circle cx="80" cy="80" r="70" fill="url(#c1Aura)" />

  <!-- Symbol: Moon + Masquerade Mask + Bat Crest -->
  <g id="symbol">
    <!-- Moon Body -->
    <circle cx="80" cy="80" r="54" fill="url(#c1Moon)" filter="url(#c1Glow)" />

    <!-- Top Bat Wing Crest silhouette -->
    <path d="M80 32 C72 42 56 40 40 50 C50 58 60 58 66 66 C72 58 76 56 80 56 C84 56 88 58 94 66 C100 58 110 58 120 50 C104 40 88 42 80 32 Z" fill="#080A12" />

    <!-- Masquerade Mask Silhouette -->
    <path d="M46 84 C54 74 72 76 80 86 C88 76 106 74 114 84 C120 94 112 108 96 106 C86 103 83 95 80 95 C77 95 74 103 64 106 C48 108 40 94 46 84 Z" fill="#080A12" />

    <!-- Glowing Violet Eyes inside Mask -->
    <ellipse cx="62" cy="88" rx="6" ry="3.5" fill="url(#c1Purple)" transform="rotate(-10 62 88)" />
    <ellipse cx="98" cy="88" rx="6" ry="3.5" fill="url(#c1Purple)" transform="rotate(10 98 88)" />

    <!-- Star Sparkle on Moon -->
    <path d="M106 58 L108 52 L110 58 L116 60 L110 62 L108 68 L106 62 L100 60 Z" fill="#FFF2DC" opacity="0.9" />
  </g>

  <!-- Typography: FMVZ HALLOWEEN (Sin UNAM) -->
  <g id="typography" transform="translate(160, 0)">
    <!-- Primary Acronym: FMVZ -->
    <text x="0" y="78" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-weight="900" font-size="52" fill="#F7F4F0" letter-spacing="1.5">
      FMVZ
    </text>

    <!-- Halloween Pill Badge -->
    <rect x="156" y="44" width="148" height="34" rx="17" fill="#15182A" stroke="#FF7417" stroke-width="1.8" />
    <text x="230" y="66" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-weight="900" font-size="16" fill="#FF9A24" letter-spacing="2.5" text-anchor="middle">
      HALLOWEEN
    </text>

    <!-- Subtitle / Descriptor -->
    <text x="2" y="110" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="16" fill="#B79AFF" letter-spacing="1">
      ✦ SEGUNDO CONCURSO DE DISFRACES 2026
    </text>

    <!-- Micro tagline -->
    <text x="2" y="132" font-family="'Inter', system-ui, sans-serif" font-weight="400" font-size="12" fill="#A7ABC0">
      Creatividad, talento y espíritu festivo
    </text>
  </g>
</svg>
