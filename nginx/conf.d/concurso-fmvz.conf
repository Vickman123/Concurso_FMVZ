# ==============================================================================
# Nginx Virtual Host Configuration — Concurso de Disfraces FMVZ
# Target: Hostinger VPS (Ubuntu 22.04 / 24.04 LTS)
# ==============================================================================

# Rate limiting zones to protect voting and registration endpoints
limit_req_zone $binary_remote_addr zone=vote_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=general_api_limit:10m rate=60r/s;

# ------------------------------------------------------------------------------
# 1. HTTP Server — Redirection to HTTPS
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name concurso.fmvz.unam.mx www.concurso.fmvz.unam.mx TU_DOMINIO.com;

    # Let's Encrypt ACME challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server — Reverse Proxy and Static Cache
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name concurso.fmvz.unam.mx www.concurso.fmvz.unam.mx TU_DOMINIO.com;

    # SSL Certificate Configuration (Certbot / Let's Encrypt paths)
    ssl_certificate /etc/letsencrypt/live/concurso.fmvz.unam.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/concurso.fmvz.unam.mx/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;

    # Modern TLS Protocols and Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Maximum payload size for costume photo uploads (15MB)
    client_max_body_size 15M;
    client_body_buffer_size 1M;

    # Gzip Compression for static assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # --------------------------------------------------------------------------
    # Location 1: Persistent Costume Photos Storage (/uploads/)
    # Served directly by Nginx for maximum throughput and low memory footprint
    # --------------------------------------------------------------------------
    location /uploads/ {
        alias /var/www/concurso-fmvz/server/uploads/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # Location 2: Real-time Server-Sent Events (SSE) Stream
    # CRITICAL: Buffering MUST be disabled for real-time live events to stream
    # --------------------------------------------------------------------------
    location /api/live/stream {
        proxy_pass http://127.0.0.1:4000/api/live/stream;
        proxy_http_version 1.1;

        # Disable buffering and caching for SSE
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # Keep connection open for continuous live events
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # Location 3: Sensitive Vote Submission with Rate Limiting
    # --------------------------------------------------------------------------
    location /api/vote/cast {
        limit_req zone=vote_limit burst=10 nodelay;

        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # Location 4: General API and Application Reverse Proxy
    # --------------------------------------------------------------------------
    location / {
        limit_req zone=general_api_limit burst=40 nodelay;

        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
