      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#090B14" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow17" x="-20%" y="-20%" width="140%" height="140%">
